<main class="container">
    <div class="cabecalho">
        <h1>Minha biblioteca</h1>
        <!-- Abre o formulário no mesmo lugar da página principal. -->
        <button type="button" (click)="abrirFormulario()">Adicionar livro</button>
    </div>

    <!-- O formulário só existe na tela enquanto este signal estiver ativo. -->
    @if (exibindoFormulario()) {
        <app-adicionar-livros
            (cancelado)="fecharFormulario()"
            (adicionado)="adicionarLivro($event)"
        />
    }

    <app-filtro-livros 
        [pesquisa]="pesquisa()" 
        [status]="filtroStatus()" 
        (pesquisaChange)="atualizarPesquisa($event)"
        (statusChange)="atualizarStatus($event)" 
    />  
    
    <app-lista-livros 
        [livros]="livrosFiltrados()" 
        [carregando]="carregando()" 
        [erro]="erro()" 
        (statusChange)="alterarStatusLivro($event)"
        (excluir)="excluirLivro($event)"
    />
</main>
